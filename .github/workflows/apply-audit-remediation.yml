name: Apply audit remediation

on:
  push:
    branches: [audit-remediation-20260916]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[audit-remediation-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-remediation-20260916
          fetch-depth: 0
      - name: Apply independently-audited repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          def rep(path, old, new):
              p=root/path; s=p.read_text()
              if old not in s: raise SystemExit(f'expected text not found in {path}')
              p.write_text(s.replace(old,new,1))

          # MDPS-AUDIT-001/002: root-link validation ordering + full media integrity decode.
          rep('src/archive/archivecore.cpp', '''Paths::Paths(QString root)\n{\n    if(root.trimmed().isEmpty()) return;\n    const auto absolute=QDir::cleanPath(QFileInfo(root).absoluteFilePath());\n    const auto canonical=QFileInfo(absolute).canonicalFilePath();\n    m_root=canonical.isEmpty()?absolute:canonical;\n}''', '''Paths::Paths(QString root)\n{\n    if(root.trimmed().isEmpty()) return;\n    // Preserve the requested path until safety validation. Canonicalizing here\n    // would resolve a symlink/junction before noLinks() can reject it.\n    m_root=QDir::cleanPath(QFileInfo(root).absoluteFilePath());\n}''')
          rep('src/archive/archivecore.cpp', '''    if(video&&videos==0)result.errors<<"No video stream";\n    if(!video&&(audios==0||videos!=0))result.errors<<"Audio representation needs AAC audio without a moving-video stream";\n    result.ok=result.errors.isEmpty();return result;\n}''', '''    if(video&&videos==0)result.errors<<"No video stream";\n    if(!video&&(audios==0||videos!=0))result.errors<<"Audio representation needs AAC audio without a moving-video stream";\n    if(result.errors.isEmpty()){\n        // ffprobe validates profile metadata but can still accept a truncated\n        // fast-start MP4. Force FFmpeg to consume/decode all A/V packets.\n        const auto decode=runProcess(tools.ffmpeg(),{"-nostdin","-v","error","-xerror","-i",absolute,\n                                                     "-map","0:v?","-map","0:a?","-f","null","-"},\n                                     m_config.archiveRoot,60*60*1000);\n        if(!decode.ok||!decode.standardError.trimmed().isEmpty())\n            result.errors<<("Media decode/integrity validation failed: "+decode.error+" "+decode.standardError.left(2000)).trimmed();\n    }\n    result.ok=result.errors.isEmpty();return result;\n}''')

          # MDPS-AUDIT-003/009: Windows native reparse tags and full reserved-name set.
          p=root/'src/archive/archivesafety.h'; s=p.read_text()
          s=s.replace('#include <QMap>\n', '#include <QMap>\n#include <QtGlobal>\n#ifdef Q_OS_WIN\n#ifndef NOMINMAX\n#define NOMINMAX\n#endif\n#include <windows.h>\n#endif\n',1)
          s=s.replace('const QRegularExpression reserved("^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(?:\\\\.|$)",QRegularExpression::CaseInsensitiveOption);', 'const QRegularExpression reserved("^(CON|PRN|AUX|NUL|COM(?:[1-9]|\\\\x{00B9}|\\\\x{00B2}|\\\\x{00B3})|LPT(?:[1-9]|\\\\x{00B9}|\\\\x{00B2}|\\\\x{00B3}))(?:\\\\.|$)",QRegularExpression::CaseInsensitiveOption);',1)
          old='''inline bool noLinks(const QString& path){\n    QString current=QDir::cleanPath(QFileInfo(path).absoluteFilePath());\n    for(;;){\n        QFileInfo info(current);\n        if(info.isSymLink())return false;\n#if QT_VERSION >= QT_VERSION_CHECK(6,2,0)\n        if(info.isJunction())return false;\n#endif\n        const auto parent=info.absolutePath();if(parent==current)break;current=parent;\n    }\n    return true;\n}'''
          new='''inline bool reparseTagAllowed(quint32 tag){return (tag & 0xFFFF0FFFu)==0x9000001Au;}\n#ifdef Q_OS_WIN\ninline bool windowsPathComponentSafe(const QString& path){\n    const auto native=QDir::toNativeSeparators(path).toStdWString();\n    const DWORD attributes=GetFileAttributesW(native.c_str());\n    if(attributes==INVALID_FILE_ATTRIBUTES||!(attributes&FILE_ATTRIBUTE_REPARSE_POINT))return true;\n    const HANDLE handle=CreateFileW(native.c_str(),0,FILE_SHARE_READ|FILE_SHARE_WRITE|FILE_SHARE_DELETE,nullptr,OPEN_EXISTING,FILE_FLAG_OPEN_REPARSE_POINT|FILE_FLAG_BACKUP_SEMANTICS,nullptr);\n    if(handle==INVALID_HANDLE_VALUE)return false;\n    FILE_ATTRIBUTE_TAG_INFO tagInfo{};\n    const bool ok=GetFileInformationByHandleEx(handle,FileAttributeTagInfo,&tagInfo,sizeof(tagInfo))!=0;\n    CloseHandle(handle);\n    return ok&&reparseTagAllowed(static_cast<quint32>(tagInfo.ReparseTag));\n}\n#endif\ninline bool noLinks(const QString& path){\n    QString current=QDir::cleanPath(QFileInfo(path).absoluteFilePath());\n    for(;;){\n        QFileInfo info(current);\n#ifdef Q_OS_WIN\n        if(!windowsPathComponentSafe(current))return false;\n#else\n        if(info.isSymLink())return false;\n#if QT_VERSION >= QT_VERSION_CHECK(6,2,0)\n        if(info.isJunction())return false;\n#endif\n#endif\n        const auto parent=info.absolutePath();if(parent==current)break;current=parent;\n    }\n    return true;\n}'''
          if old not in s: raise SystemExit('archivesafety noLinks block not found')
          p.write_text(s.replace(old,new,1))

          # MDPS-AUDIT-004: mutable settings must live outside the sealed package.
          p=root/'src/archive/archivetab.cpp'; s=p.read_text().replace('#include <QSplitter>\n','#include <QSplitter>\n#include <QStandardPaths>\n',1)
          old='''QString appSettingsFile()\n{\n    const auto d=QDir(QCoreApplication::applicationDirPath()).filePath("local/settings");\n    QDir().mkpath(d);\n    return QDir(d).filePath("archive-mode.ini");\n}'''
          new='''QString appSettingsFile()\n{\n    auto d=QStandardPaths::writableLocation(QStandardPaths::AppConfigLocation);\n    if(d.isEmpty())d=QDir(QStandardPaths::writableLocation(QStandardPaths::GenericConfigLocation)).filePath("Media Downloader PS");\n    QDir().mkpath(d);\n    return QDir(d).filePath("archive-mode.ini");\n}\nQString legacyAppSettingsFile(){return QDir(QCoreApplication::applicationDirPath()).filePath("local/settings/archive-mode.ini");}'''
          if old not in s: raise SystemExit('settings helper not found')
          s=s.replace(old,new,1)
          old='''    QSettings s(appSettingsFile(),QSettings::IniFormat);\n    const auto relative=s.value("ArchiveRootRelativeToApp").toString();'''
          new='''    QSettings s(appSettingsFile(),QSettings::IniFormat);\n    const auto configured=QDir::cleanPath(s.value("ArchiveRoot").toString());\n    if(!configured.isEmpty()&&QFileInfo(configured).isDir())return configured;\n    QSettings legacy(legacyAppSettingsFile(),QSettings::IniFormat);\n    const auto relative=legacy.value("ArchiveRootRelativeToApp").toString();'''
          if old not in s: raise SystemExit('configuredRoot settings block not found')
          s=s.replace(old,new,1)
          old='''    const auto app=QCoreApplication::applicationDirPath(); const auto rel=QDir::fromNativeSeparators(QDir(app).relativeFilePath(root));\n    QSettings s(appSettingsFile(),QSettings::IniFormat); s.setValue("ArchiveRootRelativeToApp",rel); s.sync();'''
          new='''    QSettings s(appSettingsFile(),QSettings::IniFormat);\n    s.setValue("ArchiveRoot",QDir::cleanPath(root)); s.remove("ArchiveRootRelativeToApp"); s.sync();'''
          if old not in s: raise SystemExit('persistRoot settings block not found')
          p.write_text(s.replace(old,new,1))

          # Regression: fast-start media whose metadata remains readable after truncation must fail verify and repair on sync.
          p=root/'tests/archive-integration-tests.py'; s=p.read_text()
          s=s.replace("'-c:a', 'aac', cls.video]", "'-c:a', 'aac', '-movflags', '+faststart', cls.video]",1)
          marker='    def test_partial_scan_preserves_membership(self):\n'
          test='''    def test_truncated_faststart_media_is_rejected_and_repaired(self):\n        self.scan()\n        self.command('sync-item', VIDEO_URL)\n        video = self.root / self.first()['video']['path']\n        payload = video.read_bytes()\n        self.assertGreater(len(payload), 4096)\n        video.write_bytes(payload[:max(4096, len(payload) * 60 // 100)])\n        probe = run([FFPROBE, '-v', 'error', '-show_streams', '-show_format', '-of', 'json', video])\n        self.assertEqual(probe.returncode, 0, probe.stderr)\n        self.command('verify-item', VIDEO_URL, expect=1)\n        self.command('sync-item', VIDEO_URL)\n        self.command('verify-item', VIDEO_URL)\n        self.assertEqual(sha(video), sha(self.video))\n\n'''
          if marker not in s: raise SystemExit('integration insertion point not found')
          p.write_text(s.replace(marker,test+marker,1))

          # Filesystem/reparse regressions.
          p=root/'tests/archive-hardening-tests.cpp'; s=p.read_text()
          old=''' else if(name=="portable-paths"){Fixture f;for(const auto& p:QStringList{"C:escape","Video/../State/items.json","Video\\\\..\\\\escape","Video/NUL.mp4","Video/x:stream","Video/trailing. ","Video//x","Video/./x"})require(!f.paths.isSafeRelative(p),"unsafe portable path accepted: "+p);require(f.paths.isSafeRelative("Video/a file [abc123DEF45].mp4"),"normal path rejected");}'''
          new=''' else if(name=="portable-paths"){Fixture f;for(const auto& p:QStringList{"C:escape","Video/../State/items.json","Video\\\\..\\\\escape","Video/NUL.mp4","Video/x:stream","Video/trailing. ","Video//x","Video/./x",QString::fromUtf8("Video/COM¹.txt"),QString::fromUtf8("Video/LPT².txt")})require(!f.paths.isSafeRelative(p),"unsafe portable path accepted: "+p);require(f.paths.isSafeRelative("Video/a file [abc123DEF45].mp4"),"normal path rejected");require(detail::reparseTagAllowed(0x9000601Au),"Cloud Files tag family rejected");require(!detail::reparseTagAllowed(0xA000000Cu),"symbolic-link tag accepted");require(!detail::reparseTagAllowed(0xA0000003u),"junction tag accepted");require(!detail::reparseTagAllowed(0x80000017u),"unknown reparse tag accepted");}'''
          if old not in s: raise SystemExit('portable-paths case not found')
          s=s.replace(old,new,1)
          needle='  else if(name=="linked-package-file"){'
          linked='''  else if(name=="linked-root"){\n   QTemporaryDir realRoot,parent;require(realRoot.isValid()&&parent.isValid(),"temp dirs");const auto link=QDir(parent.path()).filePath("archive-link");\n#ifdef Q_OS_WIN\n   const auto target=QDir::toNativeSeparators(realRoot.path());const auto nativeLink=QDir::toNativeSeparators(link);\n   const auto created=CreateSymbolicLinkW(reinterpret_cast<LPCWSTR>(nativeLink.utf16()),reinterpret_cast<LPCWSTR>(target.utf16()),0x1|0x2);\n   const auto error=GetLastError();require(created!=0,QString("make root symlink error=%1").arg(error));require(QFileInfo(link).isSymLink(),"root symlink missing");\n#else\n   require(QFile::link(realRoot.path(),link),"make root symlink");\n#endif\n   Paths linked(link);Store store(linked);QString e;require(!store.initialize(&e),"linked Archive Root accepted");\n  }\n'''
          if needle not in s: raise SystemExit('linked package insertion point not found')
          p.write_text(s.replace(needle,linked+needle,1))
          p=root/'CMakeLists.txt'; s=p.read_text(); old='deleted-title linked-package-file)';
          if old not in s: raise SystemExit('hardening cases list not found')
          p.write_text(s.replace(old,'deleted-title linked-package-file linked-root)',1))

          # Documentation: do not overclaim hashes or release readiness.
          p=root/'docs/qualification/INSTALLATION_AND_USER_GUIDE.md'; s=p.read_text(); s=s.replace('`verify-item` rechecks state, files, hashes and FFprobe metadata.','`verify-item` rechecks representation state, filesystem presence/safety, media profile metadata, and full FFmpeg decode integrity. The target-host harness separately performs SHA-256 stability checks across idempotent reruns.',1); p.write_text(s)
          p=root/'docs/qualification/RELEASE_QUALIFICATION_REPORT.md'; s=p.read_text(); old='## FINAL STATUS\n\n**RELEASE READY**';
          if old not in s: raise SystemExit('release-ready marker not found')
          p.write_text(s.replace(old,'## FINAL STATUS\n\n**NOT RELEASE READY - AUDIT REMEDIATION PENDING FRESH QUALIFICATION**\n\nThe previous release-ready decision is superseded by an independent audit. The changed source requires fresh sanitizer, Windows CI/package, target-host, GUI package-immutability and endurance qualification before a new release-ready decision.',1))
          p=root/'docs/qualification/README.md'; s=p.read_text(); first=s.find('\n')+1; notice='\n> **Audit remediation status:** the historical candidate below is retained for traceability, but its previous release-ready conclusion is superseded. The `audit-remediation-20260916` branch requires fresh qualification before release.\n'; p.write_text(s[:first]+notice+s[first:])
          (root/'docs/qualification/AUDIT_REMEDIATION.md').write_text('''# Independent Audit Remediation\n\nAudited baseline: `cc8bb65d8d38d482f94da1eb1edd2714b242f577`. This branch does **not** claim release readiness.\n\n- MDPS-AUDIT-001: full FFmpeg decode/integrity validation implemented; fresh qualification required.\n- MDPS-AUDIT-002: requested Archive Root preserved until link validation; linked-root regression added.\n- MDPS-AUDIT-003: Windows native reparse-tag inspection added; Cloud Files family explicitly allowed, other reparse tags fail closed.\n- MDPS-AUDIT-004: GUI settings moved to `QStandardPaths::AppConfigLocation`; legacy package-local settings are read-only migration input.\n- MDPS-AUDIT-005: obsolete upstream publisher/dispatch workflows removed.\n- MDPS-AUDIT-006: stale release-ready claim superseded pending a new exact candidate.\n- MDPS-AUDIT-007: endurance runner supplied, but >=60 minute execution remains required.\n- MDPS-AUDIT-008: **OPEN** - unknown-ID placeholder identity still depends on mutable playlist position and requires an architecture decision.\n- MDPS-AUDIT-009: superscript Windows COM/LPT reserved names covered.\n- MDPS-AUDIT-010: `verify-item` docs corrected; durable content hashes remain a separate optional design.\n- MDPS-AUDIT-011: Unix executable modes restored.\n''')

          # Endurance helper: Kilo only needs to execute it for >=60 minutes.
          (root/'scripts/archive-endurance.ps1').write_text(r'''param([Parameter(Mandatory=$true)][string]$PackageRoot,[Parameter(Mandatory=$true)][string]$ArchiveRoot,[Parameter(Mandatory=$true)][string]$PlaylistUrl,[Parameter(Mandatory=$true)][string]$VideoUrl,[int]$DurationMinutes=60,[string]$OutputJson='')
$ErrorActionPreference='Stop'; if($DurationMinutes -lt 60){throw 'Endurance qualification requires at least 60 minutes.'}
$cli=Join-Path $PackageRoot 'archive-cli.exe'; if(!(Test-Path -LiteralPath $cli -PathType Leaf)){throw "archive-cli.exe not found: $cli"}
if([string]::IsNullOrWhiteSpace($OutputJson)){$OutputJson=Join-Path (Split-Path -Parent $ArchiveRoot) 'archive-endurance.json'}; New-Item -ItemType Directory -Path $ArchiveRoot -Force|Out-Null
function Invoke-A([string[]]$a){$o=& $cli @a 2>&1; [pscustomobject]@{Args=$a;ExitCode=$LASTEXITCODE;Output=($o -join "`n");At=(Get-Date).ToString('o')}}
function Hashes{$m=@{};foreach($d in @('Video','Audio')){$p=Join-Path $ArchiveRoot $d;if(Test-Path $p){Get-ChildItem $p -File -Recurse|%{$m[$_.FullName.Substring($ArchiveRoot.Length).TrimStart('\\')]=(Get-FileHash $_.FullName -Algorithm SHA256).Hash}}};$m}
$p=Invoke-A @('preflight',$ArchiveRoot);if($p.ExitCode){throw $p.Output};$deadline=(Get-Date).AddMinutes($DurationMinutes);$i=0;$fail=@();$baseline=$null
while((Get-Date)-lt $deadline){$i++;foreach($a in @(@('scan',$ArchiveRoot,$PlaylistUrl,'Endurance playlist'),@('sync-item',$ArchiveRoot,$VideoUrl),@('verify-item',$ArchiveRoot,$VideoUrl))){$r=Invoke-A $a;if($r.ExitCode){$fail+=,$r;break}};if($fail.Count){break};$h=Hashes;if($null -eq $baseline){$baseline=$h}else{foreach($k in $baseline.Keys){if(!$h.ContainsKey($k)-or $h[$k]-ne $baseline[$k]){$fail+=,[pscustomobject]@{Args=@('hash-stability');ExitCode=1;Output="Media hash changed: $k"};break}}};if($fail.Count){break}}
$r=[ordered]@{schema_version=1;ended=(Get-Date).ToString('o');requested_minutes=$DurationMinutes;iterations=$i;failures=$fail;media_hashes=$baseline;pass=($fail.Count-eq 0 -and (Get-Date)-ge $deadline)};$r|ConvertTo-Json -Depth 8|Set-Content $OutputJson -Encoding UTF8;if(!$r.pass){throw "Endurance failed or ended early: $OutputJson"};Write-Host "Endurance PASS: $OutputJson"
''')

          # Remove inherited workflows that dispatch/build upstream instead of this repository.
          for name in ['LinuxQt6Git.yml','PublishHereMacOsArmRelease.yml','PublishHereMacOsIntelRelease.yml','PublishHereWindowsRelease.yml','PublishThereMacOsArmGit.yml','PublishThereMacOsArmRelease.yml','PublishThereMacOsIntelGit.yml','PublishThereMacOsIntelRelease.yml','PublishThereWindowsGit.yml','PublishThereWindowsRelease.yml']:
              q=root/'.github/workflows'/name
              if q.exists(): q.unlink()
          PY
          chmod +x build_arch.sh build_fedora.sh src/update_translations src/media-downloader.desktop src/flatpak/io.github.mhogomchungu.media-downloader.desktop
          rm -f .github/workflows/apply-audit-remediation.yml
          git diff --check
          python -m py_compile tests/archive-integration-tests.py
      - name: Commit remediated source
        shell: bash
        run: |
          git config user.name 'OpenAI audit remediation'
          git config user.email 'audit-remediation@users.noreply.github.com'
          git add -A
          git commit -m '[audit-remediation-applied] Fix independently audited release blockers'
          git push origin HEAD:audit-remediation-20260916
