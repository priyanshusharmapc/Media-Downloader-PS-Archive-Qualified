name: Archive Qt6 qualification

on:
  push:
    branches: [main, audit2-remediation, archive-mode-v1, archive-mode-v1-qualification-wip, audit-remediation-20260916, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-qt6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: debian@sha256:d5ce19d4736f0ebbacd686d1040271a5aeb0cc920f5990c1bfae1717627f0674 # trixie-20260918 amd64
    timeout-minutes: 30
    steps:
      - name: Prepare matching Linux build toolchain
        run: |
          apt-get update
          apt-get install -y git ca-certificates cmake ninja-build g++ python3 ffmpeg
          apt-get install -y qt6-base-dev qt6-base-dev-tools
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile Python policy suite
        run: python3 -m compileall -q tests
      - name: Validate qualification publication references
        run: python3 scripts/validate-qualification-publication.py --source-root .
      - name: Configure unchanged fork / Archive candidate
        run: cmake -S . -B build -G Ninja -DBUILD_WITH_QT6=ON -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        env:
          ARCHIVE_TEST_TMP: ${{ github.workspace }}/archive-test-tmp
          ARCHIVE_TEST_CONFIG_ROOT: ${{ github.workspace }}/archive-test-config
        run: mkdir -p "$ARCHIVE_TEST_TMP" "$ARCHIVE_TEST_CONFIG_ROOT" && ctest --test-dir build --output-on-failure --output-junit Testing/Temporary/ctest-junit.xml
      - name: Configure address and undefined-behavior sanitizer tests
        run: cmake -S . -B build-sanitized -G Ninja -DBUILD_WITH_QT6=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build instrumented Archive executables
        run: cmake --build build-sanitized --parallel 2
      - name: Prove sanitizer native-filename binary exists
        run: test -x build-sanitized/library-posix-native-filename-tests
      - name: Sanitizer regression and integration tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          QT_QPA_PLATFORM: offscreen
          ARCHIVE_TEST_TMP: ${{ github.workspace }}/archive-test-tmp-sanitized
          ARCHIVE_TEST_CONFIG_ROOT: ${{ github.workspace }}/archive-test-config-sanitized
        run: mkdir -p "$ARCHIVE_TEST_TMP" "$ARCHIVE_TEST_CONFIG_ROOT" && ctest --test-dir build-sanitized --output-on-failure --output-junit Testing/Temporary/ctest-junit.xml
  windows:
    needs: [linux]
    if: ${{ always() && !cancelled() }}
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prove Git Bash can find Python
        shell: bash
        run: |
          set -euo pipefail
          PYBIN="$(command -v python.exe || command -v python3 || command -v python || true)"
          test -n "$PYBIN"
          "$PYBIN" -c "import sys; print(sys.executable)"
          command -v gh
          gh --version
      - name: Compile Python policy suite
        run: python -m compileall -q tests
      - name: Install Qt6 and matching MinGW
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: '6.8.1'
          arch: win64_mingw
          host: windows
          target: desktop
          tools: tools_mingw1310
          cache: false
      - name: Select matching compiler
        shell: pwsh
        run: |
          $qtParent = Split-Path (Split-Path $env:QT_ROOT_DIR -Parent) -Parent
          $compiler = Join-Path $qtParent 'Tools/mingw1310_64/bin'
          if (!(Test-Path (Join-Path $compiler 'g++.exe'))) { throw 'Matching MinGW compiler missing' }
          $compiler | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Enable Windows symbolic-link qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
          $probeRoot = Join-Path $env:RUNNER_TEMP 'archive-symlink-privilege-probe'
          New-Item -ItemType Directory -Path $probeRoot -Force | Out-Null
          $target = Join-Path $probeRoot 'target'
          $link = Join-Path $probeRoot 'link'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          New-Item -ItemType SymbolicLink -Path $link -Target $target -ErrorAction Stop | Out-Null
          if ((Get-Item -LiteralPath $link -Force).LinkType -ne 'SymbolicLink') { throw 'Windows symbolic-link probe did not create a symbolic link' }
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DBUILD_WITH_QT6=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Assemble self-contained portable candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          New-Item -ItemType Directory -Force "$out/local" | Out-Null
          New-Item -ItemType Directory -Force "$out/bin" | Out-Null
          New-Item -ItemType Directory -Force "$out/3rdParty/ffmpeg/bin" | Out-Null
          Copy-Item build/media-downloader.exe $out
          Copy-Item build/archive-cli.exe $out
          Copy-Item scripts/archive-local-harness.ps1 "$out/archive-local-harness.ps1"
          Copy-Item LICENSE.txt $out
          Copy-Item translations $out -Recurse
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime "$out/media-downloader.exe"
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt GUI failed' }
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime "$out/archive-cli.exe"
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt CLI failed' }
          if (Test-Path 'resources/archive') { Copy-Item resources/archive "$out/archive-resources" -Recurse }

          $ytUrl = 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp.exe'
          $ytSha = '66674953fe251b89f4d08c5f0e35e0728679bd67ab3d7d05c0562af101dd3e7a'
          $denoUrl = 'https://github.com/denoland/deno/releases/download/v2.9.6/deno-x86_64-pc-windows-msvc.zip'
          $denoSha = '15e5300b0ba3c3695a7621d90160a746ec9e710228cee639afa9d580f6e3cd11'
          $ffmpegUrl = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-12-13-12/ffmpeg-n9.0.1-29-gad500d59cb-win64-gpl-shared-9.0.zip'
          $ffmpegSha = '737a61c09e41d77a95bf461892a59ef7a71e3813f6def4d0b17c9a761bf04af5'

          $downloads = Join-Path $env:RUNNER_TEMP 'archive-runtime-downloads'
          New-Item -ItemType Directory -Force $downloads | Out-Null
          $ytFile = Join-Path $downloads 'yt-dlp.exe'
          $denoZip = Join-Path $downloads 'deno.zip'
          $ffmpegZip = Join-Path $downloads 'ffmpeg.zip'
          Invoke-WebRequest -Uri $ytUrl -OutFile $ytFile
          Invoke-WebRequest -Uri $denoUrl -OutFile $denoZip
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegZip

          function Assert-Sha256([string]$path,[string]$expected) {
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA256 mismatch for $path expected=$expected actual=$actual" }
          }
          Assert-Sha256 $ytFile $ytSha
          Assert-Sha256 $denoZip $denoSha
          Assert-Sha256 $ffmpegZip $ffmpegSha
          Copy-Item $ytFile "$out/bin/yt-dlp.exe"

          $denoExtract = Join-Path $downloads 'deno'
          Expand-Archive -Path $denoZip -DestinationPath $denoExtract -Force
          $denoExe = Get-ChildItem $denoExtract -Filter deno.exe -Recurse | Select-Object -First 1
          if (!$denoExe) { throw 'deno.exe missing from pinned Deno package' }
          Copy-Item $denoExe.FullName "$out/bin/deno.exe"

          $ffmpegExtract = Join-Path $downloads 'ffmpeg'
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegExtract -Force
          $ffmpegExe = Get-ChildItem $ffmpegExtract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (!$ffmpegExe) { throw 'ffmpeg.exe missing from pinned FFmpeg package' }
          Copy-Item (Join-Path $ffmpegExe.Directory.FullName '*') "$out/3rdParty/ffmpeg/bin" -Recurse -Force
          if (!(Test-Path "$out/3rdParty/ffmpeg/bin/ffprobe.exe")) { throw 'ffprobe.exe missing from pinned FFmpeg package' }

          @(
            'yt-dlp=2026.08.19 sha256=' + $ytSha,
            'deno=2.9.6 sha256=' + $denoSha,
            'ffmpeg=n9.0.1-29-gad500d59cb sha256=' + $ffmpegSha
          ) | Set-Content "$out/RUNTIME_VERSIONS.txt" -Encoding utf8
          @{ repository=$env:GITHUB_REPOSITORY; commit=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; qualification='assembled-not-yet-qualified' } | ConvertTo-Json | Set-Content "$out/build-identity.json" -Encoding utf8
      - name: Full regression and real-media integration tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          $testRoot = Join-Path $env:GITHUB_WORKSPACE 'archive-test-tmp'
          $configRoot = Join-Path $env:GITHUB_WORKSPACE 'archive-test-config'
          New-Item -ItemType Directory -Path $testRoot,$configRoot -Force | Out-Null
          $env:ARCHIVE_TEST_TMP = $testRoot
          $env:ARCHIVE_TEST_CONFIG_ROOT = $configRoot
          $env:PATH = "$out/3rdParty/ffmpeg/bin;$env:PATH"
          $env:ARCHIVE_TEST_FFMPEG = "$out/3rdParty/ffmpeg/bin/ffmpeg.exe"
          $env:ARCHIVE_TEST_FFPROBE = "$out/3rdParty/ffmpeg/bin/ffprobe.exe"
          ctest --test-dir build --output-on-failure --output-junit Testing/Temporary/ctest-junit.xml
          if ($LASTEXITCODE -ne 0) { throw 'Archive tests failed' }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$out/archive-local-harness.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Packaged Archive preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          $root = Join-Path $env:RUNNER_TEMP 'archive-preflight-root'
          & "$out/archive-cli.exe" preflight $root
          if ($LASTEXITCODE -ne 0) { throw "Archive preflight failed with exit $LASTEXITCODE" }
      - name: Portable GUI launch smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          $logDir = Join-Path $env:RUNNER_TEMP 'portable-gui-smoke'
          New-Item -ItemType Directory -Force $logDir | Out-Null
          Get-ChildItem $out -Recurse | Select-Object FullName,Length | Format-Table -AutoSize | Out-String -Width 4096 | Set-Content (Join-Path $logDir 'tree.txt')
          Write-Host "tree written $(Join-Path $logDir 'tree.txt')"
          $required = @(
            'media-downloader.exe',
            'platforms/qwindows.dll',
            'Qt6Core.dll',
            'Qt6Gui.dll',
            'Qt6Widgets.dll',
            'libstdc++-6.dll',
            'libgcc_s_seh-1.dll',
            'libwinpthread-1.dll'
          )
          foreach ($rel in $required) {
            $p = Join-Path $out $rel
            if (!(Test-Path -LiteralPath $p)) { Write-Host "MISSING $rel" } else { Write-Host "PRESENT $rel size=$((Get-Item -LiteralPath $p).Length)" }
          }
          Write-Host 'PRE-EXISTING PROCESSES'
          Get-Process | Where-Object { $_.Name -match 'media-downloader' } | Format-Table Id,Name,StartTime -AutoSize | Out-String | Write-Host
          Write-Host 'SESSION (quser is noise; winlogon is the pause predicate)'
          quser 2>&1 | Write-Host
          Get-Process winlogon -ErrorAction SilentlyContinue | Format-Table Id,ProcessName | Out-String | Write-Host
          $env:QT_DEBUG_PLUGINS = '1'
          $env:QT_LOGGING_RULES = 'qt.qpa.*=true'
          $env:QT_ASSUME_STDERR_HAS_CONSOLE = '1'
          $process = Start-Process -FilePath (Join-Path $out 'media-downloader.exe') -WorkingDirectory $out -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()
          Write-Host "HasExited=$($process.HasExited) ExitCode=$(if ($process.HasExited) { $process.ExitCode } else { 'running' })"
          $dumps = Join-Path $env:LOCALAPPDATA 'CrashDumps'
          if (Test-Path -LiteralPath $dumps) { Get-ChildItem -LiteralPath $dumps | ForEach-Object { Write-Host $_.FullName } }
          if ($process.HasExited) { throw "Portable GUI exited during smoke test with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - name: Packaged yt-dlp FFmpeg FFprobe end-to-end runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          $work = Join-Path $env:RUNNER_TEMP 'archive-runtime-e2e'
          $serve = Join-Path $work 'serve'
          $download = Join-Path $work 'download'
          New-Item -ItemType Directory -Force $serve,$download | Out-Null
          $fixture = Join-Path $serve 'archive-smoke.mp4'
          & "$out/3rdParty/ffmpeg/bin/ffmpeg.exe" -y -f lavfi -i 'testsrc2=size=320x180:rate=24' -f lavfi -i 'sine=frequency=1000:sample_rate=48000' -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 128k $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Failed to generate runtime media fixture' }
          $server = Start-Process -FilePath python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory',$serve -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            & "$out/bin/yt-dlp.exe" --ignore-config --no-playlist --ffmpeg-location "$out/3rdParty/ffmpeg/bin" -o "$download/downloaded.%(ext)s" 'http://127.0.0.1:8765/archive-smoke.mp4'
            if ($LASTEXITCODE -ne 0) { throw 'Packaged yt-dlp failed local media download' }
            $media = Get-ChildItem $download -File | Where-Object { $_.Name -like 'downloaded.*' } | Select-Object -First 1
            if (!$media) { throw 'Packaged yt-dlp produced no downloaded media' }
            & "$out/3rdParty/ffmpeg/bin/ffprobe.exe" -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt -of default=nw=1 $media.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Packaged ffprobe could not validate downloaded video' }
            $audio = Join-Path $download 'extracted.m4a'
            & "$out/3rdParty/ffmpeg/bin/ffmpeg.exe" -y -i $media.FullName -vn -c:a aac -b:a 192k $audio
            if ($LASTEXITCODE -ne 0) { throw 'Packaged ffmpeg failed audio extraction' }
            & "$out/3rdParty/ffmpeg/bin/ffprobe.exe" -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1 $audio
            if ($LASTEXITCODE -ne 0) { throw 'Packaged ffprobe could not validate extracted audio' }
          } finally {
            if ($server -and !$server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Q25 local http fixture scan and sync
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          $root = Join-Path $env:RUNNER_TEMP 'archive-q25-fixture-root'
          New-Item -ItemType Directory -Force $root | Out-Null
          $url = 'http://127.0.0.1:8765/archive-smoke.mp4'
          $work = Join-Path $env:RUNNER_TEMP 'archive-runtime-e2e'
          $serve = Join-Path $work 'serve'
          New-Item -ItemType Directory -Force $serve | Out-Null
          $fixture = Join-Path $serve 'archive-smoke.mp4'
          & "$out/3rdParty/ffmpeg/bin/ffmpeg.exe" -y -f lavfi -i 'testsrc2=size=320x180:rate=24' -f lavfi -i 'sine=frequency=1000:sample_rate=48000' -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 128k $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Failed to generate Q25 media fixture' }
          $server = Start-Process -FilePath python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory',$serve -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            & "$out/archive-cli.exe" scan $root $url 'Q25 local http fixture'
            if ($LASTEXITCODE -ne 0) { throw "Q25 scan failed exit=$LASTEXITCODE" }
            & "$out/archive-cli.exe" sync-item $root $url
            if ($LASTEXITCODE -ne 0) { throw "Q25 sync-item failed exit=$LASTEXITCODE" }
            Write-Host 'Q25 GHA local-fixture scan/sync PASS'
          } finally {
            if ($server -and !$server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: YouTube discovery advisory evidence
        continue-on-error: true
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          $root = Join-Path $env:RUNNER_TEMP 'archive-youtube-advisory-root'
          & "$out/archive-cli.exe" scan $root 'https://www.youtube.com/playlist?list=PLwiyx1dc3P2JR9N8gQaQN_BCvlSlap7re' 'yt-dlp documented example playlist'
          Write-Host "GitHub-hosted YouTube advisory exit=$LASTEXITCODE. Local Windows harness remains authoritative for real YouTube acceptance."
          exit 0
      - name: Seal qualification identity and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          @{ repository=$env:GITHUB_REPOSITORY; commit=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; qualification='windows-ci-qualified-for-local-harness'; youtube_acceptance='run archive-local-harness.ps1 on target Windows host' } | ConvertTo-Json | Set-Content "$out/build-identity.json" -Encoding utf8
          Get-ChildItem $out -Recurse | Select-Object FullName,Length | Format-Table -AutoSize | Out-String -Width 4096 | Set-Content "$out/PORTABLE_MANIFEST.txt" -Encoding utf8
          Get-ChildItem $out -File -Recurse | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($out,$_.Path).Replace('\','/')
            "$($_.Hash.ToLowerInvariant())  $relative"
          } | Sort-Object | Set-Content "$out/SHA256SUMS.txt" -Encoding ascii
      - name: Generate and validate exact release identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable/Media-Downloader-PS'
          $artifactName = "Media-Downloader-PS-Windows-Qt6-$env:GITHUB_SHA"
          $payloadName = "Media-Downloader-PS-Windows-Qt6-$env:GITHUB_SHA.zip"
          $payloadZip = Join-Path $env:GITHUB_WORKSPACE "portable/$payloadName"
          if (Test-Path -LiteralPath $payloadZip) { Remove-Item -LiteralPath $payloadZip -Force }
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $payloadZip -CompressionLevel Optimal
          $payloadSha = (Get-FileHash -LiteralPath $payloadZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $identity = [ordered]@{
            schema_version = 1
            repository = $env:GITHUB_REPOSITORY
            git_ref = $env:GITHUB_REF
            commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            artifact_name = $artifactName
            payload_file = $payloadName
            payload_sha256 = $payloadSha
          }
          $identityPath = Join-Path $env:GITHUB_WORKSPACE 'portable/current-release.json'
          $identity | ConvertTo-Json | Set-Content -LiteralPath $identityPath -Encoding utf8
          $check = Get-Content -LiteralPath $identityPath -Raw | ConvertFrom-Json
          if ($check.repository -ne $env:GITHUB_REPOSITORY -or
              $check.commit -ne $env:GITHUB_SHA -or
              [string]$check.run_id -ne [string]$env:GITHUB_RUN_ID -or
              [string]$check.run_attempt -ne [string]$env:GITHUB_RUN_ATTEMPT -or
              $check.git_ref -ne $env:GITHUB_REF -or
              $check.artifact_name -ne $artifactName -or
              $check.payload_sha256 -ne $payloadSha) {
            throw 'Generated release identity is not bound to the executing qualification run'
          }
      - name: Dry-run compact JSON and ZIP digest (pull_request only)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          PYBIN="$(command -v python.exe || command -v python3 || command -v python || true)"
          test -n "$PYBIN"
          zip="portable/Media-Downloader-PS-Windows-Qt6-${GITHUB_SHA}.zip"
          identity="portable/current-release.json"
          test -f "$zip"
          test -f "$identity"
          "$PYBIN" - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          sha = os.environ['GITHUB_SHA']
          ident = json.loads(Path('portable/current-release.json').read_text(encoding='utf-8'))
          digest = hashlib.sha256(Path('portable/Media-Downloader-PS-Windows-Qt6-' + sha + '.zip').read_bytes()).hexdigest()
          if ident.get('commit') != sha:
              raise SystemExit('dry-run commit mismatch')
          if ident.get('payload_sha256') != digest:
              raise SystemExit('dry-run payload_sha256 mismatch')
          path = Path('qualification-' + sha + '.json')
          path.write_text(json.dumps({
              'schema_version': 2,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'linux': 'success',
              'windows': 'success',
              'actions_artifacts': 'ephemeral; workflow GC removes them',
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('PR dry-run qualification publish: PASS')
          PY
      - name: GUI settings preserve package seal
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:GITHUB_WORKSPACE 'gui-settings-test'
          $archiveRoot = Join-Path $testRoot 'ArchiveRoot'
          $configRoot = Join-Path $testRoot 'Config'
          New-Item -ItemType Directory -Path $archiveRoot,$configRoot -Force | Out-Null
          $env:ARCHIVE_TEST_CONFIG_ROOT = $configRoot
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE/tests/archive-gui-package-immutability.ps1" -PackageRoot "$env:GITHUB_WORKSPACE/portable/Media-Downloader-PS" -ArchiveRoot $archiveRoot -OutputJson "$testRoot/results.json"
      - name: Publish compact immutable qualification identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.linux.result == 'success' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="qualification-${GITHUB_SHA}"
          manifest="qualification-${GITHUB_SHA}.json"
          zip="portable/Media-Downloader-PS-Windows-Qt6-${GITHUB_SHA}.zip"
          identity="portable/current-release.json"
          PYBIN="$(command -v python.exe || command -v python3 || command -v python || true)"
          test -n "$PYBIN"
          "$PYBIN" - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('qualification-' + os.environ['GITHUB_SHA'] + '.json')
          path.write_text(json.dumps({
              'schema_version': 2,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'linux': 'success',
              'windows': 'success',
              'actions_artifacts': 'ephemeral; workflow GC removes them',
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          test -f "$zip"
          test -f "$identity"
          test -f "$manifest"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p /tmp/prior-qual
            gh release download "$tag" --pattern "qualification-${GITHUB_SHA}.json" --dir /tmp/prior-qual
            gh release download "$tag" --pattern "Media-Downloader-PS-Windows-Qt6-${GITHUB_SHA}.zip" --dir /tmp/prior-qual
            gh release download "$tag" --pattern "current-release.json" --dir /tmp/prior-qual
            "$PYBIN" - <<'PY'
          import hashlib, json, os, pathlib, sys
          sha = os.environ['GITHUB_SHA']
          prior = pathlib.Path('/tmp/prior-qual')
          ident = json.loads((prior / 'current-release.json').read_text(encoding='utf-8'))
          blob = (prior / ('Media-Downloader-PS-Windows-Qt6-' + sha + '.zip')).read_bytes()
          digest = hashlib.sha256(blob).hexdigest()
          if ident.get('commit') != sha:
              raise SystemExit('prior Release commit is not this GITHUB_SHA; do not overwrite')
          if ident.get('payload_sha256') != digest:
              raise SystemExit('prior ZIP bytes do not match prior current-release.json')
          print('Existing qualification Release is the immutable first publish; newly built ZIP is not compared (Compress-Archive is not byte-reproducible).')
          PY
            exit 0
          fi
          gh release create "$tag" "$manifest" "$zip" "$identity" --target "$GITHUB_SHA" \
            --title "Qualification $GITHUB_SHA" \
            --notes "Linux and Windows Archive Qt6 qualification executed and passed for this exact commit. Actions artifacts are ephemeral."
  publish-qualification-evidence:
    name: publish durable qualification evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify qualification release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="qualification-${GITHUB_SHA}"
          gh release view "$tag" --json tagName,assets > /tmp/rel.json
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          sha = os.environ['GITHUB_SHA']
          rel = json.loads(pathlib.Path('/tmp/rel.json').read_text())
          if rel.get('tagName') != 'qualification-' + sha:
              raise SystemExit('tag mismatch')
          names = {a['name'] for a in rel['assets']}
          need = {
              'qualification-' + sha + '.json',
              'Media-Downloader-PS-Windows-Qt6-' + sha + '.zip',
              'current-release.json',
          }
          missing = need - names
          if missing:
              raise SystemExit('missing release assets: ' + ','.join(sorted(missing)))
          PY
          python3 - <<'PY'
          import json, os, subprocess, sys
          sha = os.environ['GITHUB_SHA']
          ref = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/ref/tags/qualification-{sha}'],
              text=True))
          obj = ref['object']
          if obj['type'] == 'commit':
              peeled = obj['sha']
          elif obj['type'] == 'tag':
              tagobj = json.loads(subprocess.check_output(
                  ['gh', 'api', obj['url']], text=True))
              peeled = tagobj['object']['sha']
          else:
              raise SystemExit('unexpected tag object type ' + obj['type'])
          if peeled != sha:
              raise SystemExit('tag does not peel to GITHUB_SHA: ' + peeled)
          print('tag peel: PASS')
          PY
          gh release download "$tag" --pattern "current-release.json"
          gh release download "$tag" --pattern "Media-Downloader-PS-Windows-Qt6-${GITHUB_SHA}.zip"
          python3 - <<'PY'
          import json, hashlib, os, pathlib
          sha = os.environ['GITHUB_SHA']
          ident = json.loads(pathlib.Path('current-release.json').read_text(encoding='utf-8'))
          blob = pathlib.Path('Media-Downloader-PS-Windows-Qt6-' + sha + '.zip').read_bytes()
          digest = hashlib.sha256(blob).hexdigest()
          if ident.get('commit') != sha:
              raise SystemExit('current-release.json commit mismatch')
          if ident.get('payload_sha256') != digest:
              raise SystemExit('payload_sha256 mismatch')
          if str(ident.get('run_id')) != str(os.environ['GITHUB_RUN_ID']):
              print('prior run_id retained (immutable first publish on this commit); this run did not replace the ZIP')
          print('qualification release verify: PASS')
          PY

  artifact-gc:
    name: purge Actions artifact and cache storage
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [linux, windows, publish-qualification-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete repository Actions artifacts and caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id' |
            while read -r id; do
              [ -z "$id" ] || gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            done
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" --jq '.actions_caches[].id' |
            while read -r id; do
              [ -z "$id" ] || gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
            done
